<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nyt — Watch</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #fef6e4;
      --surface:   #fffdf8;
      --ink:       #2d2b26;
      --shadow:    #e0c898;
      --coral:     #f4845f;
      --coral-bg:  #fde8e0;
      --muted:     #a09880;
      --font-hand: 'Caveat', cursive;
      --font-body: 'Nunito', sans-serif;
      --radius-card: 14px 8px 16px 10px / 10px 16px 8px 14px;
      --radius-pill: 50px 40px 48px 44px / 42px 50px 40px 46px;
    }

    html, body {
      background-color: var(--bg);
      background-image: radial-gradient(circle, #d9c9a3 1.2px, transparent 1.2px);
      background-size: 26px 26px;
      color: var(--ink);
      font-family: var(--font-body);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── NAV ───────────────────────────────────────────── */
    nav {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: var(--ink);
      border-bottom: 2.5px solid var(--shadow);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo img { height: 38px; width: auto; display: block; }

    .nav-center { display: flex; align-items: center; gap: 24px; }

    .nav-link {
      font-family: var(--font-hand);
      font-size: 20px;
      font-weight: 500;
      color: var(--surface);
      text-decoration: none;
      opacity: 0.7;
      transition: opacity 0.15s;
    }

    .nav-link:hover { opacity: 1; }

    .nav-right { display: flex; align-items: center; gap: 12px; }

    #btn-logout {
      background: none;
      border: 1.5px solid var(--shadow);
      color: var(--surface);
      font-family: var(--font-hand);
      font-size: 16px;
      padding: 4px 14px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.15s;
    }

    #btn-logout:hover { opacity: 1; }

    /* ── CONTENT ───────────────────────────────────────── */
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 22px 72px;
    }

    /* ── BACK BUTTON ───────────────────────────────────── */
    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-hand);
      font-size: 20px;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      padding: 4px 16px 4px 12px;
      border: 2px solid var(--muted);
      border-radius: var(--radius-pill);
      margin-bottom: 24px;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
      outline: none;
    }

    .back:hover { color: var(--ink); border-color: var(--ink); background: var(--surface); }
    .back:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }
    .back svg { flex-shrink: 0; }

    /* ── PLAYER FRAME ──────────────────────────────────── */
    .player-frame {
      background: var(--ink);
      border: 3px solid var(--ink);
      border-radius: var(--radius-card);
      box-shadow: 7px 7px 0 var(--shadow);
      overflow: hidden;
      width: 100%;
      aspect-ratio: 16 / 9;
      position: relative;
      cursor: none;
    }

    .player-frame.ctrl-show,
    .player-frame.ctrl-pause { cursor: default; }

    .player-frame.yt-frame { cursor: default; }

    video, iframe.yt-embed {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
      border: none;
    }

    /* ── SUBTITLE STYLING ──────────────────────────────── */
    ::cue {
      font-family: var(--font-body);
      font-size: 1.05em;
      font-weight: 600;
      background: rgba(45, 43, 38, 0.80);
      color: #fffdf8;
      padding: 2px 8px;
      border-radius: 4px;
    }

    /* ── RESUME BANNER ─────────────────────────────────── */
    #resume-banner {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: rgba(45,43,38,0.88);
      color: #fffdf8;
      font-family: var(--font-hand);
      font-size: 17px;
      padding: 8px 20px;
      border-radius: var(--radius-pill);
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 10;
    }

    #resume-banner.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── PLAYER CONTROLS ───────────────────────────────── */
    .player-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(30,26,20,0.92) 80%);
      padding: 44px 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      opacity: 0;
      transform: translateY(5px);
      transition: opacity 0.22s, transform 0.22s;
      pointer-events: none;
      z-index: 5;
    }

    .player-frame.ctrl-show .player-controls,
    .player-frame.ctrl-pause .player-controls {
      opacity: 1;
      transform: translateY(0);
      pointer-events: all;
    }

    /* Seek bar */
    .ctrl-seek-wrap { position: relative; }

    .ctrl-range {
      -webkit-appearance: none;
      appearance: none;
      display: block;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: linear-gradient(
        to right,
        var(--coral) var(--pct, 0%),
        rgba(255,255,255,0.28) var(--pct, 0%)
      );
      cursor: pointer;
      outline: none;
      border: none;
    }

    .ctrl-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: var(--coral);
      border: 2.5px solid #fff;
      border-radius: 50%;
      box-shadow: 0 1px 5px rgba(0,0,0,0.5);
      transition: transform 0.12s;
    }

    .ctrl-range:hover::-webkit-slider-thumb { transform: scale(1.3); }

    .ctrl-range::-moz-range-track {
      height: 4px;
      background: rgba(255,255,255,0.28);
      border-radius: 2px;
    }

    .ctrl-range::-moz-range-progress {
      height: 4px;
      background: var(--coral);
      border-radius: 2px;
    }

    .ctrl-range::-moz-range-thumb {
      width: 14px;
      height: 14px;
      background: var(--coral);
      border: 2.5px solid #fff;
      border-radius: 50%;
    }

    /* Volume range */
    .vol-range {
      width: 72px;
      height: 3px;
      background: linear-gradient(
        to right,
        rgba(255,255,255,0.88) var(--pct, 100%),
        rgba(255,255,255,0.28) var(--pct, 100%)
      );
    }

    .vol-range::-webkit-slider-thumb {
      width: 11px;
      height: 11px;
      background: #fff;
      border: none;
      box-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }

    .vol-range:hover::-webkit-slider-thumb { transform: scale(1.25); }

    .vol-range::-moz-range-progress { background: rgba(255,255,255,0.88); }

    .vol-range::-moz-range-thumb {
      width: 11px;
      height: 11px;
      background: #fff;
      border: none;
    }

    /* Controls row */
    .ctrl-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Control buttons */
    .ctrl-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.82);
      cursor: pointer;
      padding: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
      flex-shrink: 0;
    }

    .ctrl-btn:hover {
      color: #fff;
      background: rgba(255,255,255,0.12);
    }

    /* Volume area */
    .ctrl-vol-wrap {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    /* Time display */
    .ctrl-time {
      font-family: var(--font-hand);
      font-size: 16px;
      font-weight: 500;
      color: rgba(255,255,255,0.82);
      white-space: nowrap;
      letter-spacing: 0.03em;
      margin: 0 5px;
      user-select: none;
    }

    /* CC button */
    .ctrl-cc-btn {
      background: none;
      border: 1.5px solid rgba(255,255,255,0.42);
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 3px 7px;
      border-radius: 4px;
      line-height: 1;
      flex-shrink: 0;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }

    .ctrl-cc-btn:hover {
      color: #fff;
      border-color: rgba(255,255,255,0.75);
    }

    .ctrl-cc-btn.cc-on {
      color: var(--coral);
      border-color: var(--coral);
      background: rgba(244,132,95,0.18);
    }

    /* Quality button (lives in the control bar so it also works in fullscreen) */
    .ctrl-quality { position: relative; flex-shrink: 0; }

    .ctrl-q-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      background: none;
      border: 1.5px solid rgba(255,255,255,0.42);
      color: rgba(255,255,255,0.82);
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      line-height: 1.2;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }

    .ctrl-q-btn:hover, .ctrl-quality.open .ctrl-q-btn {
      color: #fff;
      border-color: rgba(255,255,255,0.8);
      background: rgba(255,255,255,0.1);
    }

    .ctrl-quality .quality-dd-menu { bottom: calc(100% + 10px); min-width: 150px; }
    .quality-dd-opt .q-right { display: flex; align-items: center; gap: 8px; }
    .quality-dd-opt .q-size { font-size: 11.5px; font-weight: 700; color: var(--muted); white-space: nowrap; }
    .quality-dd-opt { white-space: nowrap; }

    /* ── BELOW PLAYER ──────────────────────────────────── */
    .player-meta {
      margin-top: 16px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .video-title {
      font-family: var(--font-hand);
      font-size: 26px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.3;
      flex: 1;
    }

    /* ── QUALITY SELECTOR ──────────────────────────────── */
    .quality-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .quality-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .quality-dd {
      position: relative;
    }

    .quality-dd-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      background: var(--surface);
      border: 2.5px solid var(--ink);
      border-radius: 8px 5px 10px 6px / 6px 10px 5px 8px;
      padding: 6px 10px 6px 12px;
      cursor: pointer;
      outline: none;
      box-shadow: 3px 3px 0 var(--shadow);
      transition: border-color 0.15s, transform 0.08s, box-shadow 0.08s;
    }

    .quality-dd-btn:hover  { border-color: var(--coral); }
    .quality-dd-btn:active { transform: translateY(1px); box-shadow: 2px 2px 0 var(--shadow); }
    .quality-dd-btn:focus-visible { border-color: var(--coral); }
    .quality-dd-btn:disabled { opacity: 0.45; cursor: default; pointer-events: none; }

    .quality-dd-btn .chev {
      transition: transform 0.18s;
      flex-shrink: 0;
      color: var(--muted);
    }

    .quality-dd.open .quality-dd-btn .chev { transform: rotate(180deg); }
    .quality-dd.open .quality-dd-btn { border-color: var(--coral); }

    .quality-dd-menu {
      position: absolute;
      bottom: calc(100% + 8px);
      right: 0;
      min-width: 132px;
      background: var(--surface);
      border: 2.5px solid var(--ink);
      border-radius: 10px 6px 12px 7px / 7px 12px 6px 10px;
      box-shadow: 4px 4px 0 var(--shadow);
      padding: 5px;
      display: flex;
      flex-direction: column;
      gap: 1px;
      opacity: 0;
      transform: translateY(4px) scale(0.98);
      pointer-events: none;
      transition: opacity 0.14s, transform 0.14s;
      z-index: 20;
      max-height: 260px;
      overflow-y: auto;
    }

    .quality-dd.open .quality-dd-menu {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: all;
    }

    .quality-dd-opt {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-family: var(--font-body);
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink);
      background: none;
      border: none;
      border-radius: 6px 4px 7px 4px / 4px 7px 4px 6px;
      padding: 7px 9px;
      cursor: pointer;
      text-align: left;
      transition: background 0.12s, color 0.12s;
    }

    .quality-dd-opt:hover { background: var(--coral-bg); }

    .quality-dd-opt.active {
      color: var(--coral);
      background: var(--coral-bg);
    }

    .quality-dd-opt .check {
      opacity: 0;
      flex-shrink: 0;
      color: var(--coral);
    }

    .quality-dd-opt.active .check { opacity: 1; }

    .quality-spinner {
      width: 16px;
      height: 16px;
      border: 2.5px solid var(--shadow);
      border-top-color: var(--coral);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .quality-spinner.show { display: block; }

    /* ── CHAPTER BAR ───────────────────────────────────── */
    #chapter-wrap {
      margin-top: 18px;
      display: none;
    }

    #chapter-bar-track {
      position: relative;
      height: 10px;
      background: var(--shadow);
      border-radius: 5px;
      border: 1.5px solid rgba(45,43,38,0.2);
      overflow: hidden;
      cursor: pointer;
    }

    .ch-seg {
      position: absolute;
      top: 0;
      height: 100%;
      background: var(--ink);
      opacity: 0.18;
      border-right: 2px solid var(--surface);
      transition: opacity 0.15s;
    }

    .ch-seg:last-child { border-right: none; }
    .ch-seg:hover { opacity: 0.5; }
    .ch-seg.active { background: var(--coral); opacity: 1; }

    #chapter-info {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 7px;
    }

    #chapter-label {
      font-family: var(--font-hand);
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
    }

    #chapter-index {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* ── LOADING ───────────────────────────────────────── */
    .loading-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: var(--surface);
      border: 2.5px solid var(--ink);
      border-radius: var(--radius-card);
      box-shadow: 5px 5px 0 var(--shadow);
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3.5px solid #e8dfc8;
      border-top-color: var(--coral);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── STATES ────────────────────────────────────────── */
    .state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 50vh;
      text-align: center;
      gap: 12px;
      padding: 0 20px;
    }

    .state-icon { width: 56px; height: 56px; margin-bottom: 4px; color: var(--muted); }
    .state-icon.coral { color: var(--coral); }

    .state h2 {
      font-family: var(--font-hand);
      font-size: 30px;
      font-weight: 700;
      color: var(--coral);
    }

    .state p {
      font-size: 15px;
      color: var(--muted);
      font-weight: 600;
      line-height: 1.7;
      max-width: 340px;
    }

    code {
      font-family: var(--font-hand);
      font-size: 15px;
      color: var(--ink);
      background: #fff3cd;
      border: 2px solid var(--ink);
      border-radius: 6px;
      padding: 1px 8px;
    }

    .btn-home {
      display: inline-block;
      margin-top: 6px;
      padding: 8px 24px;
      font-family: var(--font-hand);
      font-size: 20px;
      font-weight: 700;
      color: var(--surface);
      background: var(--coral);
      border: 2.5px solid var(--ink);
      border-radius: var(--radius-pill);
      box-shadow: 4px 4px 0 var(--ink);
      text-decoration: none;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .btn-home:hover  { transform: translateY(-2px); box-shadow: 6px 6px 0 var(--ink); }
    .btn-home:active { transform: translateY(2px);  box-shadow: 2px 2px 0 var(--ink); }
  </style>
</head>
<body>

<nav>
  <a href="/" class="logo">
    <img src="/static/logo.svg" alt="nyt">
  </a>
  <div class="nav-center">
    <a href="/" class="nav-link">Videos</a>
    <a href="/channels" class="nav-link">Channels</a>
    <a href="/settings" class="nav-link">Settings</a>
  </div>
  <div class="nav-right">
    <button id="btn-logout" style="display:none" onclick="logout()">Sign out</button>
  </div>
</nav>

<div class="container">
  <a href="/" class="back">
    <i data-lucide="arrow-left" style="width:18px;height:18px;"></i>
    Back
  </a>
  <div id="root"></div>
</div>

<script>
  const root = document.getElementById('root');

  // ── Helpers ──────────────────────────────────────────
  async function apiFetch(url, opts = {}) {
    const res = await fetch(url, opts);
    if (res.status === 401) { window.location.replace('/login'); throw new Error('unauthenticated'); }
    return res;
  }

  async function logout() {
    await fetch('/api/v1/auth/logout', { method: 'POST' });
    window.location.replace('/login');
  }

  async function checkAuth() {
    try { await fetch('/api/v1/auth/refresh', { method: 'POST' }); } catch {}
    try {
      const res = await fetch('/api/v1/auth/status');
      if (!res.ok) return;
      const { auth_enabled, logged_in } = await res.json();
      if (auth_enabled && logged_in) document.getElementById('btn-logout').style.display = '';
    } catch { /* non-critical */ }
  }

  function esc(str) {
    const d = document.createElement('div');
    d.textContent = String(str ?? '');
    return d.innerHTML;
  }

  function fmtTime(secs) {
    secs = Math.floor(secs || 0);
    const h = Math.floor(secs / 3600);
    const m = Math.floor((secs % 3600) / 60);
    const s = secs % 60;
    return h > 0
      ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
      : `${m}:${String(s).padStart(2,'0')}`;
  }

  const LANG_NAMES = {
    en:'English', 'en-US':'English (US)', 'en-GB':'English (UK)',
    es:'Spanish', fr:'French', de:'German', it:'Italian',
    pt:'Portuguese', ru:'Russian', ja:'Japanese', ko:'Korean',
    zh:'Chinese', ar:'Arabic', hi:'Hindi', nl:'Dutch', sv:'Swedish',
    pl:'Polish', tr:'Turkish', uk:'Ukrainian', cs:'Czech',
  };
  const langLabel = l => LANG_NAMES[l] || LANG_NAMES[l.split('-')[0]] || l;

  // ── State management ──────────────────────────────────
  function showLoading() {
    root.innerHTML = `<div class="loading-wrap"><div class="spinner"></div></div>`;
  }

  function showNotFound(videoId) {
    root.innerHTML = `
      <div class="state">
        <i data-lucide="film" class="state-icon coral"></i>
        <h2>Video not found</h2>
        <p>No video with id <code>${esc(videoId)}</code> exists in the library.</p>
        <a href="/" class="btn-home">Go Home</a>
      </div>`;
    lucide.createIcons();
  }

  function showError() {
    root.innerHTML = `
      <div class="state">
        <i data-lucide="wifi-off" class="state-icon coral"></i>
        <h2>Can't reach the server</h2>
        <p>Start the backend with <code>nyt serve</code></p>
        <a href="/" class="btn-home">Go Home</a>
      </div>`;
    lucide.createIcons();
  }

  // ── Resume playback ───────────────────────────────────
  const _RESUME_KEY  = id => `nyt_pos_${id}`;
  const _FINISHED_WITHIN = 10;    // within this many seconds of the end counts as "watched to the end"

  function savePosition(videoEl, videoId) {
    const t = videoEl.currentTime, d = videoEl.duration;
    if (!(t > 2)) return;                                   // also skips the transient 0s while a source reloads
    try {
      if (Number.isFinite(d) && d > 0 && t >= d - _FINISHED_WITHIN) localStorage.removeItem(_RESUME_KEY(videoId));
      else localStorage.setItem(_RESUME_KEY(videoId), String(t));
    } catch {}
  }

  function clearPosition(videoId) {
    try { localStorage.removeItem(_RESUME_KEY(videoId)); } catch {}
  }

  function getSavedPosition(videoId) {
    try { return parseFloat(localStorage.getItem(_RESUME_KEY(videoId)) || '0') || 0; } catch { return 0; }
  }

  function flashBanner(text) {
    const banner = document.getElementById('resume-banner');
    if (!banner) return;
    banner.textContent = text;
    banner.classList.add('show');
    clearTimeout(flashBanner._t);
    flashBanner._t = setTimeout(() => banner.classList.remove('show'), 2800);
  }

  function attachResume(videoEl, videoId) {
    const saved = getSavedPosition(videoId);
    let settled = !(saved > 5);     // until a saved position has been applied, don't overwrite it with the start of the video
    let lastSave = 0;

    function applySaved() {
      if (settled) return;
      const d = videoEl.duration;
      const stale = Number.isFinite(d) && saved >= d - _FINISHED_WITHIN;      // the file changed or it was already finished
      if (stale || Math.abs(videoEl.currentTime - saved) <= 2) { settled = true; return; }
      videoEl.addEventListener('seeked', () => { settled = true; }, { once: true });
      videoEl.currentTime = saved;
      flashBanner(`Resuming from ${fmtTime(saved)}`);
      setTimeout(() => { settled = true; }, 8000);                            // never stay locked if the seek event is lost
    }

    if (videoEl.readyState >= 1) applySaved();
    else videoEl.addEventListener('loadedmetadata', applySaved, { once: true });

    // Save while playing (every ~5s), not only on pause/unload — those aren't reliable on every browser.
    videoEl.addEventListener('timeupdate', () => {
      const now = Date.now();
      if (settled && !videoEl.seeking && now - lastSave >= 5000) { lastSave = now; savePosition(videoEl, videoId); }
    });
    const flush = () => { if (settled) savePosition(videoEl, videoId); };
    videoEl.addEventListener('pause', flush);
    window.addEventListener('beforeunload', flush);
    window.addEventListener('pagehide', flush);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });

    // Only a real finish forgets the position; a stray `ended` from a broken stream must not wipe it.
    videoEl.addEventListener('ended', () => {
      const d = videoEl.duration;
      if (Number.isFinite(d) && d > 0 && videoEl.currentTime >= d - 1.5) clearPosition(videoId);
    });
  }

  // ── Quality selector (in the control bar, so it also works in fullscreen) ──
  const QUALITY_KEY = 'nyt.player.quality';     // remembered preferred height across videos; 0 = original
  let _currentFormatId = null;
  let _formats = [];

  function buildSrc(videoId, formatId) {
    const base = `/api/v1/videos/${encodeURIComponent(videoId)}`;
    return formatId && formatId !== 'original' ? `${base}?format_id=${encodeURIComponent(formatId)}` : base;
  }

  function fmtSize(n) {
    if (!n) return '';
    const u = ['B', 'KB', 'MB', 'GB'];
    let i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return `${n.toFixed(n >= 100 || i === 0 ? 0 : 1)} ${u[i]}`;
  }

  // Start at the quality the viewer last chose: the largest version at or under it, else the nearest one above it.
  function pickInitialFormat(formats) {
    const original = formats[0];
    let pref = null;
    try { pref = JSON.parse(localStorage.getItem(QUALITY_KEY)); } catch {}
    if (!pref || formats.length < 2) return original;
    const variants = formats.filter(f => f.height > 0);
    const fit = variants.filter(f => f.height <= pref).sort((a, b) => b.height - a.height)[0];
    const above = variants.sort((a, b) => a.height - b.height)[0];
    return fit || above || original;
  }

  function renderQualityMenu() {
    const menu = document.getElementById('quality-dd-menu');
    if (!menu) return;
    menu.innerHTML = _formats.map(f => `
      <button type="button" class="quality-dd-opt${f.format_id === _currentFormatId ? ' active' : ''}"
              role="option" aria-selected="${f.format_id === _currentFormatId}"
              data-format-id="${esc(f.format_id)}">
        <span>${esc(f.label)}</span>
        <span class="q-right">
          <span class="q-size">${esc(fmtSize(f.size))}</span>
          <i data-lucide="check" class="check" style="width:14px;height:14px;"></i>
        </span>
      </button>`).join('');
    lucide.createIcons();
  }

  function attachQualitySelector(videoId) {
    const dd    = document.getElementById('quality-dd');
    const btn   = document.getElementById('quality-dd-btn');
    const menu  = document.getElementById('quality-dd-menu');
    const label = document.getElementById('quality-dd-current');
    const frame = document.getElementById('player-frame');
    if (!dd || !btn || !menu) return;

    function closeMenu() {
      dd.classList.remove('open');
      frame?.classList.remove('menu-open');
      btn.setAttribute('aria-expanded', 'false');
    }

    function openMenu() {
      dd.classList.add('open');
      frame?.classList.add('menu-open', 'ctrl-show');      // keep the controls on screen while choosing
      btn.setAttribute('aria-expanded', 'true');
    }

    btn.addEventListener('click', e => {
      e.stopPropagation();
      dd.classList.contains('open') ? closeMenu() : openMenu();
    });

    menu.addEventListener('click', e => {
      const opt = e.target.closest('.quality-dd-opt');
      if (!opt) return;
      e.stopPropagation();
      const formatId = opt.dataset.formatId;
      closeMenu();
      if (formatId === _currentFormatId) return;

      const videoEl = document.querySelector('video');
      if (!videoEl) return;
      const pos        = videoEl.currentTime;
      const wasPaused  = videoEl.paused;
      const picked     = _formats.find(f => f.format_id === formatId);
      _currentFormatId = formatId;
      label.textContent = picked?.label || '';
      renderQualityMenu();
      try { localStorage.setItem(QUALITY_KEY, JSON.stringify(picked?.height || 0)); } catch {}

      videoEl.src = buildSrc(videoId, _currentFormatId);
      videoEl.load();
      videoEl.addEventListener('canplay', () => {
        videoEl.currentTime = pos;
        if (wasPaused) videoEl.pause(); else videoEl.play();     // <video autoplay> would otherwise start a paused video
        flashBanner(`Quality: ${picked?.label || ''}`);
      }, { once: true });
    });

    document.addEventListener('click', e => { if (!dd.contains(e.target)) closeMenu(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });
  }

  // ── Chapter bar ───────────────────────────────────────
  function attachChapters(videoEl, chapters) {
    if (!chapters || chapters.length === 0) return;

    const wrap  = document.getElementById('chapter-wrap');
    const track = document.getElementById('chapter-bar-track');
    const label = document.getElementById('chapter-label');
    const idx   = document.getElementById('chapter-index');
    if (!wrap || !track) return;

    const dur = chapters[chapters.length - 1].end_time;
    if (!dur || dur <= 0) return;

    track.innerHTML = chapters.map((ch, i) => {
      const left  = ((ch.start_time / dur) * 100).toFixed(4);
      const width = (((ch.end_time - ch.start_time) / dur) * 100).toFixed(4);
      return `<div class="ch-seg" data-idx="${i}" data-start="${ch.start_time}"
                   style="left:${left}%;width:${width}%;" title="${esc(ch.title)}"></div>`;
    }).join('');

    wrap.style.display = '';

    track.querySelectorAll('.ch-seg').forEach(seg => {
      seg.addEventListener('click', () => {
        videoEl.currentTime = parseFloat(seg.dataset.start);
        videoEl.play();
      });
    });

    videoEl.addEventListener('timeupdate', () => {
      const t    = videoEl.currentTime;
      let active = null;
      track.querySelectorAll('.ch-seg').forEach((seg, i) => {
        const start = parseFloat(seg.dataset.start);
        const end   = i < chapters.length - 1 ? chapters[i + 1].start_time : Infinity;
        const on    = t >= start && t < end;
        seg.classList.toggle('active', on);
        if (on) active = i;
      });
      if (active !== null) {
        if (label) label.textContent = chapters[active].title;
        if (idx)   idx.textContent   = `Chapter ${active + 1} of ${chapters.length}`;
      } else {
        if (label) label.textContent = '';
        if (idx)   idx.textContent   = '';
      }
    });
  }

  // ── Subtitles ─────────────────────────────────────────
  function attachSubtitles(videoEl, videoId, subtitles) {
    if (!subtitles || subtitles.length === 0) return;
    subtitles.forEach((sub, i) => {
      const track = document.createElement('track');
      track.kind    = 'subtitles';
      track.src     = `/api/v1/videos/${encodeURIComponent(videoId)}/subtitles/${encodeURIComponent(sub.lang)}`;
      track.srclang = sub.lang.split('-')[0];
      track.label   = langLabel(sub.lang);
      if (i === 0) track.default = true;
      videoEl.appendChild(track);
    });

    const ccBtn = document.getElementById('ctrl-cc');
    if (ccBtn) {
      ccBtn.style.display = '';
      ccBtn.classList.add('cc-on');
    }
  }

  // ── Custom player controls ────────────────────────────
  function attachCustomControls(videoEl) {
    const frame   = document.getElementById('player-frame');
    const seekEl  = document.getElementById('ctrl-seek');
    const playBtn = document.getElementById('ctrl-play');
    const muteBtn = document.getElementById('ctrl-mute');
    const volEl   = document.getElementById('ctrl-vol');
    const timeEl  = document.getElementById('ctrl-time');
    const fsBtn   = document.getElementById('ctrl-fs');
    const ccBtn   = document.getElementById('ctrl-cc');
    if (!frame || !seekEl || !playBtn) return;

    let isSeeking  = false;
    let wasPlaying = false;
    let hideTimer  = null;
    let ccOn       = true;

    // ── Show / hide controls ──────────────────────────
    function showCtrls() {
      frame.classList.add('ctrl-show');
      clearTimeout(hideTimer);
      if (!videoEl.paused) {
        hideTimer = setTimeout(() => { if (!frame.classList.contains('menu-open')) frame.classList.remove('ctrl-show'); }, 3000);
      }
    }

    frame.addEventListener('mousemove', showCtrls);
    frame.addEventListener('mouseenter', showCtrls);
    frame.addEventListener('mouseleave', () => {
      if (!videoEl.paused && !frame.classList.contains('menu-open')) {
        clearTimeout(hideTimer);
        frame.classList.remove('ctrl-show');
      }
    });

    // ── Play / pause ──────────────────────────────────
    function togglePlay() {
      if (videoEl.paused || videoEl.ended) videoEl.play();
      else videoEl.pause();
    }

    videoEl.addEventListener('click', togglePlay);
    playBtn.addEventListener('click', e => { e.stopPropagation(); togglePlay(); });

    function syncPlayState() {
      const paused = videoEl.paused || videoEl.ended;
      frame.classList.toggle('ctrl-pause', paused);
      if (paused) clearTimeout(hideTimer);
      playBtn.querySelector('.icon-play').style.display  = paused ? '' : 'none';
      playBtn.querySelector('.icon-pause').style.display = paused ? 'none' : '';
    }

    videoEl.addEventListener('play',  syncPlayState);
    videoEl.addEventListener('pause', syncPlayState);
    videoEl.addEventListener('ended', syncPlayState);
    syncPlayState();

    // ── Seek ──────────────────────────────────────────
    function updateSeekUI() {
      if (isSeeking || !videoEl.duration) return;
      const pct = (videoEl.currentTime / videoEl.duration) * 100;
      seekEl.value = videoEl.currentTime / videoEl.duration;
      seekEl.style.setProperty('--pct', pct.toFixed(3) + '%');
    }

    function updateTime(overrideTime) {
      const c = overrideTime ?? videoEl.currentTime;
      const d = videoEl.duration;
      timeEl.textContent = isNaN(d)
        ? `${fmtTime(c)} / --:--`
        : `${fmtTime(c)} / ${fmtTime(d)}`;
    }

    seekEl.addEventListener('mousedown', () => {
      isSeeking  = true;
      wasPlaying = !videoEl.paused;
      if (wasPlaying) videoEl.pause();
    });

    seekEl.addEventListener('input', () => {
      const pct = parseFloat(seekEl.value) * 100;
      seekEl.style.setProperty('--pct', pct.toFixed(3) + '%');
      updateTime(parseFloat(seekEl.value) * (videoEl.duration || 0));
    });

    seekEl.addEventListener('change', () => {
      videoEl.currentTime = parseFloat(seekEl.value) * (videoEl.duration || 0);
      isSeeking = false;
      if (wasPlaying) videoEl.play();
    });

    videoEl.addEventListener('timeupdate', () => { updateSeekUI(); updateTime(); });
    videoEl.addEventListener('loadedmetadata', () => { updateSeekUI(); updateTime(); });

    // ── Volume ────────────────────────────────────────
    function updateVolUI() {
      const v = videoEl.muted ? 0 : videoEl.volume;
      volEl.value = v;
      volEl.style.setProperty('--pct', (v * 100).toFixed(1) + '%');
      const isOff = videoEl.muted || videoEl.volume === 0;
      muteBtn.querySelector('.icon-vol-on').style.display  = isOff ? 'none' : '';
      muteBtn.querySelector('.icon-vol-off').style.display = isOff ? '' : 'none';
    }

    muteBtn.addEventListener('click', e => {
      e.stopPropagation();
      videoEl.muted = !videoEl.muted;
    });

    volEl.addEventListener('input', e => {
      e.stopPropagation();
      videoEl.volume = parseFloat(volEl.value);
      videoEl.muted  = false;
      volEl.style.setProperty('--pct', (parseFloat(volEl.value) * 100).toFixed(1) + '%');
    });

    // Remember volume + mute globally (shared by every video) instead of resetting to 100% on each page.
    const VOL_KEY = 'nyt.player.volume';
    try {
      const saved = JSON.parse(localStorage.getItem(VOL_KEY) || 'null');
      if (saved && Number.isFinite(saved.volume)) {
        videoEl.volume = Math.min(1, Math.max(0, saved.volume));
        videoEl.muted  = !!saved.muted;
      }
    } catch {}

    videoEl.addEventListener('volumechange', () => {
      updateVolUI();
      try { localStorage.setItem(VOL_KEY, JSON.stringify({ volume: videoEl.volume, muted: videoEl.muted })); } catch {}
    });
    updateVolUI();

    // ── CC ────────────────────────────────────────────
    if (ccBtn) {
      ccBtn.addEventListener('click', e => {
        e.stopPropagation();
        ccOn = !ccOn;
        const tracks = videoEl.textTracks;
        for (let i = 0; i < tracks.length; i++) {
          tracks[i].mode = ccOn ? 'showing' : 'hidden';
        }
        ccBtn.classList.toggle('cc-on', ccOn);
      });
    }

    // ── Fullscreen ────────────────────────────────────
    fsBtn.addEventListener('click', e => {
      e.stopPropagation();
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        (frame.requestFullscreen || frame.webkitRequestFullscreen).call(frame);
      }
    });

    document.addEventListener('fullscreenchange', () => {
      const full = !!document.fullscreenElement;
      fsBtn.querySelector('.icon-maximize').style.display = full ? 'none' : '';
      fsBtn.querySelector('.icon-minimize').style.display = full ? '' : 'none';
    });

    // ── Keyboard shortcuts ────────────────────────────
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      switch (e.code) {
        case 'Space': case 'KeyK':
          e.preventDefault(); togglePlay(); showCtrls(); break;
        case 'KeyM':
          e.preventDefault(); videoEl.muted = !videoEl.muted; break;
        case 'KeyF':
          e.preventDefault(); fsBtn.click(); break;
        case 'ArrowLeft':
          e.preventDefault();
          videoEl.currentTime = Math.max(0, videoEl.currentTime - 5);
          showCtrls(); break;
        case 'ArrowRight':
          e.preventDefault();
          videoEl.currentTime = Math.min(videoEl.duration || 0, videoEl.currentTime + 5);
          showCtrls(); break;
        case 'ArrowUp':
          e.preventDefault();
          videoEl.volume = Math.min(1, videoEl.volume + 0.1);
          videoEl.muted = false; break;
        case 'ArrowDown':
          e.preventDefault();
          videoEl.volume = Math.max(0, videoEl.volume - 0.1); break;
      }
    });
  }

  // ── Player: downloaded (local file, custom controls) ──
  function showPlayer(videoId, title, formats) {
    _formats = formats || [];
    const initial = _formats.length > 1 ? pickInitialFormat(_formats) : null;
    _currentFormatId = initial ? initial.format_id : 'original';
    const src = buildSrc(videoId, _currentFormatId);
    root.innerHTML = `
      <div class="player-frame ctrl-pause" id="player-frame">
        <video autoplay preload="metadata">
          <source src="${esc(src)}" type="video/mp4">
        </video>
        <div id="resume-banner"></div>
        <div class="player-controls" id="player-controls">
          <div class="ctrl-seek-wrap">
            <input type="range" class="ctrl-range" id="ctrl-seek"
                   min="0" max="1" step="0.001" value="0" aria-label="Seek">
          </div>
          <div class="ctrl-row">
            <button class="ctrl-btn" id="ctrl-play" aria-label="Play">
              <i data-lucide="play"  class="icon-play"  style="width:22px;height:22px"></i>
              <i data-lucide="pause" class="icon-pause" style="display:none;width:22px;height:22px"></i>
            </button>
            <div class="ctrl-vol-wrap">
              <button class="ctrl-btn" id="ctrl-mute" aria-label="Mute">
                <i data-lucide="volume-2" class="icon-vol-on"  style="width:20px;height:20px"></i>
                <i data-lucide="volume-x" class="icon-vol-off" style="display:none;width:20px;height:20px"></i>
              </button>
              <input type="range" class="ctrl-range vol-range" id="ctrl-vol"
                     min="0" max="1" step="0.05" value="1" aria-label="Volume">
            </div>
            <span class="ctrl-time" id="ctrl-time">0:00 / --:--</span>
            <div style="flex:1"></div>
            <div class="quality-dd ctrl-quality" id="quality-dd" style="display:none">
              <button class="ctrl-q-btn" id="quality-dd-btn" type="button"
                      aria-haspopup="listbox" aria-expanded="false" aria-label="Video quality">
                <i data-lucide="settings" style="width:13px;height:13px"></i>
                <span id="quality-dd-current"></span>
              </button>
              <div class="quality-dd-menu" id="quality-dd-menu" role="listbox"></div>
            </div>
            <button class="ctrl-cc-btn" id="ctrl-cc" style="display:none" aria-label="Toggle subtitles">CC</button>
            <button class="ctrl-btn" id="ctrl-fs" aria-label="Fullscreen">
              <i data-lucide="maximize" class="icon-maximize" style="width:20px;height:20px"></i>
              <i data-lucide="minimize" class="icon-minimize" style="display:none;width:20px;height:20px"></i>
            </button>
          </div>
        </div>
      </div>
      <div id="chapter-wrap">
        <div id="chapter-bar-track"></div>
        <div id="chapter-info">
          <span id="chapter-label"></span>
          <span id="chapter-index"></span>
        </div>
      </div>
      <div class="player-meta">
        ${title ? `<div class="video-title">${esc(title)}</div>` : '<div></div>'}
      </div>`;

    const videoEl = document.querySelector('video');
    attachResume(videoEl, videoId);

    // Only offered when there is more than the original (i.e. quality versions exist for this video).
    if (_formats.length > 1) {
      document.getElementById('quality-dd').style.display = '';
      document.getElementById('quality-dd-current').textContent = initial.label;
      renderQualityMenu();
      attachQualitySelector(videoId);
    }
  }

  // ── Player: stream-only (not downloaded — YouTube iframe) ──
  function showYoutubePlayer(videoId, title) {
    const saved  = getSavedPosition(videoId);
    const start  = saved > 5 ? Math.floor(saved) : 0;
    const embed  = `https://www.youtube.com/embed/${encodeURIComponent(videoId)}`
                 + `?autoplay=1&start=${start}&rel=0&modestbranding=1`;

    root.innerHTML = `
      <div class="player-frame yt-frame" id="player-frame">
        <iframe class="yt-embed"
                src="${esc(embed)}"
                title="YouTube video player"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen></iframe>
      </div>
      <div class="player-meta">
        ${title ? `<div class="video-title">${esc(title)}</div>` : '<div></div>'}
        <div class="quality-wrap" style="color:var(--muted);font-size:13px;font-weight:600;">
          Streaming from YouTube — use the player's own quality settings
        </div>
      </div>`;
  }

  // ── Init ──────────────────────────────────────────────
  async function init() {
    const parts   = window.location.pathname.split('/watch/');
    const videoId = parts.length > 1 ? parts[1].split('/')[0] : null;

    if (!videoId) { window.location.replace('/'); return; }

    showLoading();

    try {
      const statusRes = await apiFetch(`/api/v1/videos/${encodeURIComponent(videoId)}/status`);

      if (!statusRes.ok) throw new Error();
      const { video_status } = await statusRes.json();
      if (!video_status.is_present) { showNotFound(videoId); return; }

      let title        = null;
      let isDownloaded = true;
      let subtitles    = [];
      let chapters      = [];

      const [listRes, metaRes, formatsRes] = await Promise.all([
        apiFetch('/api/v1/videos/list/').catch(() => null),
        apiFetch(`/api/v1/videos/${encodeURIComponent(videoId)}/metadata`).catch(() => null),
        apiFetch(`/api/v1/videos/${encodeURIComponent(videoId)}/formats`).catch(() => null),
      ]);

      if (listRes && listRes.ok) {
        const { videos_info } = await listRes.json();
        const entry = videos_info?.find(v => v.video_id === videoId);
        title        = entry?.video_title ?? null;
        isDownloaded = entry ? !!entry.is_downloaded : true;
      }

      if (!isDownloaded) {
        // Not downloaded — play directly from YouTube via its own embed player,
        // which already handles quality selection natively.
        showYoutubePlayer(videoId, title);
        return;
      }

      if (metaRes && metaRes.ok) {
        const meta = await metaRes.json();
        subtitles = meta.subtitles || [];
        chapters  = meta.chapters  || [];
      }

      let formats = [];
      if (formatsRes && formatsRes.ok) formats = (await formatsRes.json()).formats || [];

      showPlayer(videoId, title, formats);
      lucide.createIcons();

      const videoEl = document.querySelector('video');
      attachCustomControls(videoEl);
      attachSubtitles(videoEl, videoId, subtitles);
      attachChapters(videoEl, chapters);

    } catch (e) {
      if (e.message !== 'unauthenticated') showError();
    }
  }

  lucide.createIcons();
  checkAuth();
  init();
</script>

</body>
</html>
