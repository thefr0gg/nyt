<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nyt — No YouTube</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #fef6e4;
      --surface:   #fffdf8;
      --ink:       #2d2b26;
      --shadow:    #e0c898;
      --coral:     #f4845f;
      --coral-bg:  #fde8e0;
      --muted:     #a09880;
      --font-hand: 'Caveat', cursive;
      --font-body: 'Nunito', sans-serif;
      --radius-card: 14px 8px 16px 10px / 10px 16px 8px 14px;
      --radius-pill: 50px 40px 48px 44px / 42px 50px 40px 46px;
    }

    html, body {
      background-color: var(--bg);
      background-image: radial-gradient(circle, #d9c9a3 1.2px, transparent 1.2px);
      background-size: 26px 26px;
      color: var(--ink);
      font-family: var(--font-body);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── NAV ───────────────────────────────────────────── */
    nav {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: var(--ink);
      border-bottom: 2.5px solid var(--shadow);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo img { height: 38px; width: auto; display: block; }

    .nav-center {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-link {
      font-family: var(--font-hand);
      font-size: 20px;
      font-weight: 500;
      color: var(--surface);
      text-decoration: none;
      opacity: 0.7;
      transition: opacity 0.15s;
    }

    .nav-link:hover, .nav-link.active { opacity: 1; }

    .watcher-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--muted);
      display: inline-block;
      transition: background 0.4s;
      cursor: default;
    }

    .watcher-dot.active { background: #6bcb77; }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #btn-logout {
      background: none;
      border: 1.5px solid var(--shadow);
      color: var(--surface);
      font-family: var(--font-hand);
      font-size: 16px;
      padding: 4px 14px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.15s;
    }

    #btn-logout:hover { opacity: 1; }

    /* ── TOOLBAR ───────────────────────────────────────── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .toolbar label {
      font-family: var(--font-hand);
      font-size: 18px;
      color: var(--muted);
    }

    .toolbar select {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      background: var(--surface);
      border: 2px solid var(--ink);
      border-radius: var(--radius-pill);
      padding: 4px 12px;
      cursor: pointer;
      outline: none;
    }

    /* ── SEARCH ────────────────────────────────────────── */
    .search-wrap {
      flex: 1;
      min-width: 180px;
      max-width: 380px;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      color: var(--muted);
      pointer-events: none;
      display: flex;
    }

    #search-input {
      width: 100%;
      font-family: var(--font-body);
      font-size: 13.5px;
      font-weight: 600;
      color: var(--ink);
      background: var(--surface);
      border: 2px solid var(--ink);
      border-radius: var(--radius-pill);
      padding: 6px 34px 6px 36px;
      outline: none;
      box-shadow: 3px 3px 0 var(--shadow);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    #search-input::placeholder { color: var(--muted); font-weight: 500; }
    #search-input:focus { border-color: var(--coral); box-shadow: 3px 3px 0 var(--coral-bg); }

    .search-clear {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 2px;
      border-radius: 50%;
      transition: color 0.15s, background 0.15s;
    }

    .search-clear:hover { color: var(--ink); background: var(--shadow); }

    /* ── MAIN ──────────────────────────────────────────── */
    main {
      max-width: 1720px;
      margin: 0 auto;
      padding: 32px 22px 72px;
    }

    /* ── GRID ──────────────────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    /* ── CARD ──────────────────────────────────────────── */
    .card {
      display: block;
      background: var(--surface);
      border: 2.5px solid var(--ink);
      border-radius: var(--radius-card);
      box-shadow: 5px 5px 0 var(--shadow);
      overflow: hidden;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease, opacity 0.2s;
      outline: none;
    }

    .card.watched { opacity: 0.55; }

    .card:nth-child(odd):hover  { transform: translateY(-5px) rotate(-0.7deg); box-shadow: 8px 8px 0 var(--shadow); }
    .card:nth-child(even):hover { transform: translateY(-5px) rotate( 0.7deg); box-shadow: 8px 8px 0 var(--shadow); }
    .card.watched:hover { opacity: 0.75; }

    .card:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }

    .card-thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #e8dfc8;
      overflow: hidden;
      border-bottom: 2px solid var(--ink);
    }

    .card-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.22s ease;
    }

    .card:hover .card-thumb { transform: scale(1.04); }

    .watched-badge {
      display: none;
      position: absolute;
      top: 7px;
      right: 8px;
      background: var(--coral);
      border: 2px solid var(--ink);
      border-radius: 50%;
      width: 24px;
      height: 24px;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .card.watched .watched-badge { display: flex; }

    .stream-badge {
      position: absolute;
      bottom: 7px;
      left: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      background: rgba(45, 43, 38, 0.72);
      border: 1.5px solid rgba(255,253,248,0.4);
      border-radius: 20px;
      font-family: var(--font-hand);
      font-size: 13px;
      font-weight: 700;
      color: #fffdf8;
      pointer-events: none;
    }

    .card-body {
      padding: 12px 14px 14px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      background: var(--surface);
    }

    .card-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid var(--ink);
      object-fit: cover;
      flex-shrink: 0;
      background: #e8dfc8;
      margin-top: 1px;
    }

    .card-meta { flex: 1; min-width: 0; }

    .card-title {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.38;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 3px;
    }

    .card-channel {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-date {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      opacity: 0.75;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    /* ── SKELETON ──────────────────────────────────────── */
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .shimmer {
      background: linear-gradient(90deg, #ede3ce 25%, #f5edd8 50%, #ede3ce 75%);
      background-size: 200% 100%;
      animation: shimmer 1.6s infinite;
    }

    .skel {
      background: var(--surface);
      border: 2.5px solid var(--ink);
      border-radius: var(--radius-card);
      box-shadow: 5px 5px 0 var(--shadow);
      overflow: hidden;
    }

    .skel-thumb { width: 100%; aspect-ratio: 16/9; }

    .skel-body { padding: 12px 14px 14px; display: flex; gap: 10px; }

    .skel-avatar { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; }

    .skel-lines { flex: 1; display: flex; flex-direction: column; gap: 8px; padding-top: 3px; }

    .skel-line { height: 12px; border-radius: 6px; }
    .skel-line.w60 { width: 60%; }

    /* ── DOWNLOAD PANEL ────────────────────────────────── */
    #dl-panel {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 300px;
      background: var(--surface);
      border: 2.5px solid var(--ink);
      border-radius: var(--radius-card);
      box-shadow: 6px 6px 0 var(--shadow);
      z-index: 200;
      overflow: hidden;
      animation: fadeIn 0.2s ease;
    }

    #dl-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: var(--ink);
      color: var(--surface);
      font-family: var(--font-hand);
      font-size: 18px;
      font-weight: 700;
    }

    #dl-header { cursor: pointer; user-select: none; }

    #dl-toggle {
      margin-left: auto;
      background: none;
      border: 0;
      padding: 2px;
      color: inherit;
      display: flex;
      cursor: pointer;
    }
    #dl-toggle svg { width: 18px; height: 18px; transition: transform 0.2s ease; }
    #dl-panel.min #dl-toggle svg { transform: rotate(180deg); }

    #dl-mini { display: none; height: 5px; background: var(--shadow); overflow: hidden; }
    #dl-mini .dl-bar { border-radius: 0; }
    #dl-panel.min #dl-mini { display: block; }
    #dl-panel.min #dl-list { display: none; }

    .dl-item {
      padding: 11px 14px;
      border-top: 1.5px solid var(--shadow);
    }

    .dl-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
    }

    .dl-bar-wrap {
      height: 5px;
      background: var(--shadow);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 4px;
    }

    .dl-bar {
      height: 100%;
      background: var(--coral);
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    .dl-bar.done  { background: #6bcb77; }
    .dl-bar.error { background: #e05252; }

    .dl-bar.transcoding {
      width: 35% !important;
      transition: none;
      animation: transcode-slide 1.4s ease-in-out infinite;
    }
    @keyframes transcode-slide {
      0%   { margin-left: 0%;  width: 30% !important; }
      50%  { margin-left: 55%; width: 35% !important; }
      100% { margin-left: 0%;  width: 30% !important; }
    }

    .dl-meta { font-size: 11px; color: var(--muted); font-weight: 600; }

    /* ── CONTEXT MENU ──────────────────────────────────── */
    #ctx-menu {
      position: fixed;
      z-index: 500;
      background: var(--surface);
      border: 2.5px solid var(--ink);
      border-radius: 12px 6px 14px 8px / 8px 14px 6px 12px;
      box-shadow: 5px 5px 0 var(--shadow);
      min-width: 190px;
      overflow: hidden;
      display: none;
      transform-origin: top left;
      animation: ctx-pop 0.12s ease;
    }

    @keyframes ctx-pop {
      from { opacity: 0; transform: scale(0.93); }
      to   { opacity: 1; transform: scale(1); }
    }

    .ctx-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 14px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.1s, color 0.1s;
      user-select: none;
    }

    .ctx-item:hover {
      background: var(--coral-bg);
      color: var(--coral);
    }

    .ctx-item.danger { color: #c94040; }
    .ctx-item.danger:hover { background: #fdeaea; color: #c94040; }

    .ctx-item svg { flex-shrink: 0; opacity: 0.75; }
    .ctx-item:hover svg { opacity: 1; }

    .ctx-sep {
      height: 1.5px;
      background: var(--shadow);
      margin: 3px 0;
    }

    #ctx-menu { max-height: calc(100vh - 16px); overflow-y: auto; }

    /* ── PIN BADGE ─────────────────────────────────────── */
    .pin-badge {
      position: absolute;
      top: 7px;
      left: 8px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffd166;
      border: 2px solid var(--ink);
      border-radius: 50%;
      color: var(--ink);
    }

    /* ── DETAILS DIALOG ────────────────────────────────── */
    .dlg-overlay {
      position: fixed;
      inset: 0;
      background: rgba(45, 43, 38, 0.45);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .dlg {
      width: 100%;
      max-width: 560px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      background: var(--surface);
      border: 2.5px solid var(--ink);
      border-radius: var(--radius-card);
      box-shadow: 6px 6px 0 var(--shadow);
      animation: ctx-pop 0.14s ease;
    }

    .dlg-head {
      position: sticky;
      top: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--ink);
      color: var(--surface);
      font-family: var(--font-hand);
      font-size: 20px;
      font-weight: 700;
    }

    .dlg-head span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .dlg-x {
      background: none;
      border: 0;
      color: inherit;
      font-size: 18px;
      cursor: pointer;
      padding: 2px 6px;
    }

    .dlg-sec { padding: 14px 16px; border-top: 1.5px solid var(--shadow); }
    .dlg-sec:first-child { border-top: 0; }
    .dlg-sec h3 { font-family: var(--font-hand); font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .dlg-note { font-size: 12.5px; font-weight: 600; color: var(--muted); line-height: 1.5; margin-top: 8px; }
    .dlg-warn { font-size: 13px; font-weight: 700; color: #c94040; margin-bottom: 8px; }

    .dlg-row { display: flex; gap: 10px; font-size: 13.5px; padding: 3px 0; }
    .dlg-row .k { width: 96px; flex-shrink: 0; color: var(--muted); font-weight: 700; }
    .dlg-row .v { flex: 1; min-width: 0; font-weight: 600; word-break: break-word; }
    .dlg-row .v.mono { font-family: monospace; font-size: 12px; }

    .dlg-variant {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      font-size: 13.5px;
      font-weight: 600;
    }
    .dlg-variant .name { flex: 1; }
    .dlg-variant .size { color: var(--muted); }

    .dlg-btn {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      background: var(--surface);
      border: 2px solid var(--ink);
      border-radius: var(--radius-pill);
      padding: 4px 14px;
      cursor: pointer;
      box-shadow: 2px 2px 0 var(--shadow);
    }
    .dlg-btn:hover:not(:disabled) { border-color: var(--coral); color: var(--coral); }
    .dlg-btn:disabled { opacity: 0.5; cursor: default; }
    .dlg-btn.primary { background: var(--coral); color: #fff; }
    .dlg-btn.primary:hover:not(:disabled) { color: #fff; filter: brightness(1.05); }
    .dlg-btn.danger { color: #c94040; }

    .dlg-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

    .dlg-select {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      background: var(--surface);
      border: 2px solid var(--ink);
      border-radius: 8px;
      padding: 4px 8px;
    }

    /* ── TOAST ─────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: var(--ink);
      color: var(--surface);
      font-family: var(--font-hand);
      font-size: 17px;
      padding: 8px 22px;
      border-radius: var(--radius-pill);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 600;
      white-space: nowrap;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── STATES ────────────────────────────────────────── */
    .state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 56vh;
      text-align: center;
      gap: 12px;
      padding: 0 20px;
    }

    .state-icon { width: 56px; height: 56px; margin-bottom: 4px; color: var(--muted); }
    .state-icon.coral { color: var(--coral); }

    .state h2 { font-family: var(--font-hand); font-size: 30px; font-weight: 700; color: var(--ink); }
    .state p { font-size: 15px; color: var(--muted); font-weight: 600; line-height: 1.7; max-width: 360px; }
    .err h2 { color: var(--coral); }

    code {
      font-family: var(--font-hand);
      font-size: 15px;
      color: var(--ink);
      background: #fff3cd;
      border: 2px solid var(--ink);
      border-radius: 6px;
      padding: 1px 8px;
    }
  </style>
</head>
<body>

<nav>
  <a href="/" class="logo">
    <img src="/static/logo.svg" alt="nyt">
  </a>
  <div class="nav-center">
    <a href="/" class="nav-link active">Videos</a>
    <a href="/channels" class="nav-link">Channels</a>
    <a href="/settings" class="nav-link">Settings</a>
    <span class="watcher-dot" id="watcher-dot" title="Watcher idle"></span>
  </div>
  <div class="nav-right">
    <button id="btn-logout" style="display:none" onclick="doLogout()">Sign out</button>
  </div>
</nav>

<div id="ctx-menu" role="menu" aria-label="Video options"></div>
<div id="toast"></div>

<div id="dlg-overlay" class="dlg-overlay" style="display:none" onclick="if (event.target === this) closeDetails()">
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
    <div class="dlg-head">
      <span id="dlg-title">Details</span>
      <button class="dlg-x" type="button" onclick="closeDetails()" aria-label="Close">✕</button>
    </div>
    <div id="dlg-body"></div>
  </div>
</div>

<div id="dl-panel" style="display:none">
  <div id="dl-header">
    <i data-lucide="download" style="width:16px;height:16px;flex-shrink:0"></i>
    <span id="dl-title">Downloading</span>
    <button id="dl-toggle" type="button" aria-label="Minimize downloads" aria-expanded="true">
      <i data-lucide="chevron-down"></i>
    </button>
  </div>
  <div id="dl-mini"><div id="dl-mini-bar" class="dl-bar" style="width:0%"></div></div>
  <div id="dl-list"></div>
</div>

<main>
  <div class="toolbar" id="toolbar" style="display:none">
    <div class="search-wrap">
      <span class="search-icon">
        <i data-lucide="search" style="width:15px;height:15px"></i>
      </span>
      <input type="text" id="search-input" placeholder="Search videos…" autocomplete="off"
             oninput="onSearch()" onkeydown="if(event.key==='Escape')clearSearch()">
      <button class="search-clear" id="search-clear" style="display:none"
              onclick="clearSearch()" aria-label="Clear search">✕</button>
    </div>
    <label>Sort</label>
    <select id="sort-by" onchange="renderVideos()">
      <option value="date">By date</option>
      <option value="channel">By channel</option>
      <option value="unwatched">Unwatched first</option>
    </select>
    <label>Filter</label>
    <select id="filter-by" onchange="renderVideos()">
      <option value="all">All</option>
      <option value="unwatched">Unwatched only</option>
    </select>
    <label>Channel</label>
    <select id="channel-by" onchange="onChannelSelect(this.value)">
      <option value="">All channels</option>
    </select>
  </div>
  <div id="root"></div>
</main>

<script src="/static/dropdown.js"></script>
<script>
  const root = document.getElementById('root');
  let allVideos = [];
  let channelFilter = null;   // channel_handle to show, or null for all
  let lastRendered  = [];     // videos in the order they're currently shown (for "mark all above")

  /* ── Fetch wrapper: redirect to /login on 401 ──────────── */
  async function apiFetch(url, options = {}) {
    const res = await fetch(url, options);
    if (res.status === 401) { window.location.replace('/login'); return null; }
    return res;
  }

  function esc(str) {
    const d = document.createElement('div');
    d.textContent = String(str ?? '');
    return d.innerHTML;
  }

  function fmtPublishDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    const days = Math.floor((Date.now() - d.getTime()) / 86400000);
    if (days < 0)  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    if (days === 0) return 'Today';
    if (days === 1) return 'Yesterday';
    if (days < 7)   return `${days} days ago`;
    if (days < 30)  return `${Math.floor(days / 7)} week${Math.floor(days / 7) > 1 ? 's' : ''} ago`;
    if (days < 365) return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function skels(n) {
    return `<div class="grid">${Array.from({ length: n }, () => `
      <div class="skel">
        <div class="skel-thumb shimmer"></div>
        <div class="skel-body">
          <div class="skel-avatar shimmer"></div>
          <div class="skel-lines">
            <div class="skel-line shimmer"></div>
            <div class="skel-line w60 shimmer"></div>
          </div>
        </div>
      </div>`).join('')}
    </div>`;
  }

  function card(v) {
    return `
      <a href="/watch/${esc(v.video_id)}" class="card${v.is_watched ? ' watched' : ''}"
         data-video-id="${esc(v.video_id)}"
         onclick="markWatched(event,'${esc(v.video_id)}')">
        <div class="card-thumb-wrap">
          <img class="card-thumb" src="${esc(v.thumbnail_url)}" alt="${esc(v.video_title)}" loading="lazy">
          <div class="watched-badge">
            <i data-lucide="check" style="width:13px;height:13px;"></i>
          </div>
          ${v.is_pinned ? `<div class="pin-badge" title="Pinned"><i data-lucide="pin" style="width:12px;height:12px;"></i></div>` : ''}
          ${!v.is_downloaded ? `<div class="stream-badge"><i data-lucide="wifi" style="width:11px;height:11px;"></i> Stream</div>` : ''}
        </div>
        <div class="card-body">
          <img class="card-avatar" src="/api/v1/channels/${encodeURIComponent(v.channel_handle)}/avatar" alt="${esc(v.channel_handle)}" loading="lazy" onerror="this.style.visibility='hidden'">
          <div class="card-meta">
            <div class="card-title">${esc(v.video_title)}</div>
            <div class="card-channel">${esc(v.channel_name || v.channel_handle)}</div>
            <div class="card-date">${esc(fmtPublishDate(v.publish_date))}</div>
          </div>
        </div>
      </a>`;
  }

  function renderVideos() {
    const sort   = document.getElementById('sort-by').value;
    const filter = document.getElementById('filter-by').value;
    const query  = (document.getElementById('search-input')?.value || '').trim().toLowerCase();

    populateChannelFilter();

    let videos = [...allVideos];

    if (filter === 'unwatched') videos = videos.filter(v => !v.is_watched);
    if (channelFilter) videos = videos.filter(v => v.channel_handle === channelFilter);

    if (query) {
      videos = videos.filter(v =>
        (v.video_title    || '').toLowerCase().includes(query) ||
        (v.channel_name   || '').toLowerCase().includes(query) ||
        (v.channel_handle || '').toLowerCase().includes(query)
      );
    }

    if (sort === 'date') {
      videos.sort((a, b) => new Date(b.publish_date) - new Date(a.publish_date));
    } else if (sort === 'channel') {
      videos.sort((a, b) => (a.channel_handle || '').localeCompare(b.channel_handle || ''));
    } else if (sort === 'unwatched') {
      videos.sort((a, b) => a.is_watched - b.is_watched);
    }

    // Pinned ("watch later") videos always come first; sort() is stable so the chosen order holds within each group.
    videos.sort((a, b) => (b.is_pinned ? 1 : 0) - (a.is_pinned ? 1 : 0));
    lastRendered = videos;

    if (videos.length === 0) {
      const [icon, title, body] = query
        ? ['search-x', 'No results', `Nothing matched <strong>${esc(query)}</strong> — try a different search.`]
        : filter === 'unwatched'
          ? ['check-circle', 'All caught up!', 'You have watched everything.']
          : ['inbox', 'Nothing here yet!', 'Start tracking a channel and videos will appear here.'];
      root.innerHTML = `
        <div class="state">
          <i data-lucide="${icon}" class="state-icon"></i>
          <h2>${title}</h2>
          <p>${body}</p>
        </div>`;
      lucide.createIcons();
      return;
    }

    root.innerHTML = `<div class="grid">${videos.map(card).join('')}</div>`;
    lucide.createIcons();
  }

  /* ── Channel filter ───────────────────────────────────── */
  let _channelSig = '';

  function populateChannelFilter() {
    const sel = document.getElementById('channel-by');
    if (!sel) return;

    const byHandle = new Map();
    for (const v of allVideos) {
      const c = byHandle.get(v.channel_handle) || { handle: v.channel_handle, name: v.channel_name || v.channel_handle, count: 0 };
      c.count++;
      byHandle.set(v.channel_handle, c);
    }
    if (channelFilter && !byHandle.has(channelFilter)) channelFilter = null;   // its last video was removed

    const list = [...byHandle.values()].sort((a, b) => a.name.localeCompare(b.name));
    const sig  = JSON.stringify(list);
    if (sig !== _channelSig) {                                                // only rebuild when the set/counts change
      _channelSig = sig;
      const all = new Option('All channels', '');
      all.dataset.hint = String(allVideos.length);
      sel.replaceChildren(all, ...list.map(c => {
        const o = new Option(c.name, c.handle);
        o.dataset.hint = String(c.count);
        return o;
      }));
    }

    const want = channelFilter || '';
    if (sel.value !== want) sel.value = want;
    window.NytDropdown?.sync(sel);
  }

  function onChannelSelect(value) {
    channelFilter = value || null;
    renderVideos();
  }

  function setChannelFilter(handle) {   // used by the right-click "Go to channel"
    channelFilter = handle;
    renderVideos();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function onSearch() {
    const input = document.getElementById('search-input');
    const clear = document.getElementById('search-clear');
    if (clear) clear.style.display = input.value ? '' : 'none';
    renderVideos();
  }

  function clearSearch() {
    const input = document.getElementById('search-input');
    const clear = document.getElementById('search-clear');
    if (input) input.value = '';
    if (clear) clear.style.display = 'none';
    renderVideos();
    input?.focus();
  }

  async function markWatched(e, videoId) {
    const card = e.currentTarget;
    if (!card.classList.contains('watched')) {
      card.classList.add('watched');
      apiFetch(`/api/v1/videos/${encodeURIComponent(videoId)}/watched`, { method: 'POST' });
      const v = allVideos.find(x => x.video_id === videoId);
      if (v) v.is_watched = true;
    }
  }

  async function doLogout() {
    await apiFetch('/api/v1/auth/logout', { method: 'POST' });
    window.location.reload();
  }

  async function checkAuth() {
    try { await fetch('/api/v1/auth/refresh', { method: 'POST' }); } catch {}
    const res = await fetch('/api/v1/auth/status');
    if (!res) return;
    const { auth_enabled, logged_in } = await res.json();
    if (auth_enabled && logged_in) {
      document.getElementById('btn-logout').style.display = 'block';
    }
  }

  async function pollWatcher() {
    const res = await apiFetch('/api/v1/watcher/status');
    if (!res) return;
    const { watcher } = await res.json();
    const dot = document.getElementById('watcher-dot');
    if (watcher.last_run) {
      const age = (Date.now() - new Date(watcher.last_run).getTime()) / 60000;
      dot.classList.toggle('active', age < 10);
      dot.title = `Last check: ${new Date(watcher.last_run).toLocaleTimeString()}`;
    }
  }

  /* ── Video list loader (called on init + after download finishes) ── */
  async function loadVideos(silent = false) {
    if (!silent) root.innerHTML = skels(12);

    const res = await apiFetch('/api/v1/videos/list/');
    if (!res) return;

    if (!res.ok) {
      root.innerHTML = `
        <div class="state err">
          <i data-lucide="wifi-off" class="state-icon coral"></i>
          <h2>Can't reach the server</h2>
          <p>Make sure the backend is running:<br><code>nyt serve</code></p>
        </div>`;
      lucide.createIcons();
      return;
    }

    const { videos_info: videos } = await res.json();

    if (!videos || videos.length === 0) {
      if (!silent) {
        root.innerHTML = `
          <div class="state">
            <i data-lucide="inbox" class="state-icon"></i>
            <h2>Nothing here yet!</h2>
            <p>Start tracking a channel and videos will appear here.<br>
               Or visit <a href="/channels" style="color:var(--coral)">Channels</a> to add one.
            </p>
          </div>`;
        lucide.createIcons();
      }
      return;
    }

    allVideos = videos;
    document.getElementById('toolbar').style.display = 'flex';
    renderVideos();
  }

  /* ── Download progress SSE ──────────────────────────────── */
  let _dlEs         = null;
  let _refreshTimer = null;

  function fmtSpeed(bps) {
    if (!bps) return '';
    return bps >= 1048576
      ? `${(bps / 1048576).toFixed(1)} MB/s`
      : `${Math.round(bps / 1024)} KB/s`;
  }

  function fmtEta(secs) {
    if (secs == null) return '';
    return secs >= 60
      ? `${Math.floor(secs / 60)}m ${secs % 60}s`
      : `${secs}s`;
  }

  let _dlLast = null;   // last progress payload, so toggling can redraw immediately

  function updateDownloadPanel(progress) {
    _dlLast = progress;
    const panel  = document.getElementById('dl-panel');
    const list   = document.getElementById('dl-list');
    const header = document.getElementById('dl-title');
    const entries = Object.entries(progress);

    if (entries.length === 0) { panel.style.display = 'none'; return; }

    panel.style.display = '';
    const nActive = entries.filter(([, d]) => ['downloading', 'merging', 'transcoding'].includes(d.status)).length;
    header.textContent  = nActive > 0 ? `Active (${nActive})` : 'Downloads';

    // Collapsed view: one overall bar (average of the in-flight items) instead of the full list.
    const live    = entries.map(([, d]) => d).filter(d => ['downloading', 'merging', 'transcoding'].includes(d.status));
    const miniBar = document.getElementById('dl-mini-bar');
    const busy    = live.some(d => d.status !== 'downloading');
    const avg     = live.length ? live.reduce((a, d) => a + (d.percent ?? 0), 0) / live.length : 100;
    miniBar.className   = busy ? 'dl-bar transcoding' : 'dl-bar';
    miniBar.style.width = busy ? '' : `${Math.round(avg)}%`;
    if (panel.classList.contains('min') && live.length && !busy) header.textContent += ` · ${Math.round(avg)}%`;

    list.innerHTML = entries.map(([vid, d]) => {
      const pct  = d.percent ?? 0;
      const meta = d.status === 'finished'    ? 'Done ✓'
                 : d.status === 'error'       ? 'Failed'
                 : d.status === 'transcoding' ? 'Transcoding…'
                 : d.status === 'merging'     ? 'Merging video + audio…'
                 : [fmtSpeed(d.speed), fmtEta(d.eta)].filter(Boolean).join(' · ');
      const cls  = d.status === 'finished'    ? 'dl-bar done'
                 : d.status === 'error'       ? 'dl-bar error'
                 : d.status === 'transcoding' || d.status === 'merging' ? 'dl-bar transcoding'
                 : 'dl-bar';
      return `
        <div class="dl-item">
          <div class="dl-title">${esc(d.title || vid)}</div>
          <div class="dl-bar-wrap"><div class="${cls}" style="${d.status === 'transcoding' || d.status === 'merging' ? '' : `width:${pct}%`}"></div></div>
          <div class="dl-meta">${d.status === 'transcoding' || d.status === 'merging' ? meta : `${Math.round(pct)}%${meta ? ' · ' + meta : ''}`}</div>
        </div>`;
    }).join('');

    lucide.createIcons();

    // Silently refresh video list 2s after the first "finished" entry appears
    const anyDone = entries.some(([, d]) => d.status === 'finished');
    if (anyDone && !_refreshTimer) {
      _refreshTimer = setTimeout(async () => {
        await loadVideos(true);
        _refreshTimer = null;
      }, 2000);
    }
  }

  // Minimize / expand the download panel (remembered across reloads).
  (function initDlPanelToggle() {
    const panel  = document.getElementById('dl-panel');
    const header = document.getElementById('dl-header');
    const toggle = document.getElementById('dl-toggle');

    function setMin(min) {
      panel.classList.toggle('min', min);
      toggle.setAttribute('aria-expanded', String(!min));
      toggle.setAttribute('aria-label', min ? 'Expand downloads' : 'Minimize downloads');
      try { localStorage.setItem('nyt.dlPanelMin', min ? '1' : '0'); } catch {}
      if (_dlLast) updateDownloadPanel(_dlLast);
    }

    let stored = null;
    try { stored = localStorage.getItem('nyt.dlPanelMin'); } catch {}
    setMin(stored === '1');

    header.addEventListener('click', () => setMin(!panel.classList.contains('min')));
  })();

  function connectSSE() {
    if (_dlEs) _dlEs.close();
    _dlEs = new EventSource('/api/v1/downloads/progress');
    _dlEs.onmessage = (e) => {
      try { updateDownloadPanel(JSON.parse(e.data)); } catch {}
    };
    // EventSource auto-reconnects on error; nothing to do here
  }

  window.addEventListener('beforeunload', () => { if (_dlEs) _dlEs.close(); });

  /* ── Init ──────────────────────────────────────────────── */
  async function init() {
    await checkAuth();
    await loadVideos();
    pollWatcher();
    setInterval(pollWatcher, 30000);
    connectSSE();
  }

  init();

  /* ── Context menu ──────────────────────────────────────── */
  const ctxMenu = document.getElementById('ctx-menu');
  let _ctxVideo = null;
  let _toastTimer = null;

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  function hideCtxMenu() {
    ctxMenu.style.display = 'none';
    _ctxVideo = null;
  }

  function showCtxMenu(e, video) {
    e.preventDefault();
    _ctxVideo = video;

    const isLocal = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
    const missingMeta = !video.video_title || !video.thumbnail_url;
    const sep = '<div class="ctx-sep"></div>';
    const item = (action, icon, label, cls = '') =>
      `<div class="ctx-item ${cls}" data-action="${action}">
         <i data-lucide="${icon}" style="width:15px;height:15px"></i>${label}
       </div>`;

    ctxMenu.innerHTML = [
      item('new-tab', 'external-link', 'Open in new tab'),
      item('youtube', 'play', 'Open on YouTube'),
      item('channel', 'user', 'Go to channel'),
      sep,
      item(video.is_watched ? 'unwatch' : 'watch', video.is_watched ? 'eye-off' : 'eye',
           video.is_watched ? 'Mark as unwatched' : 'Mark as watched'),
      item('watch-above', 'check-check', 'Mark all above as watched'),
      item(video.is_pinned ? 'unpin' : 'pin', video.is_pinned ? 'pin-off' : 'pin',
           video.is_pinned ? 'Unpin' : 'Pin to top (watch later)'),
      sep,
      item('details', 'info', 'Details…'),
      video.is_downloaded
        ? item('quality', 'layers', 'Quality versions…') + item('redownload', 'download', 'Re-download at…')
        : item('download', 'download', 'Download') + item('redownload', 'download', 'Download at…'),
      video.is_downloaded && isLocal ? item('reveal', 'folder-open', 'Show in folder') : '',
      missingMeta ? item('refresh-meta', 'refresh-cw', 'Refresh metadata') : '',
      sep,
      item('copy-url', 'link', 'Copy YouTube URL'),
      sep,
      video.is_downloaded ? item('delete-file', 'hard-drive', 'Delete local file') : '',
      item('remove', 'trash-2', 'Remove from library', 'danger'),
    ].join('');

    ctxMenu.style.display = 'block';   // the stylesheet default is display:none, so '' would leave it hidden
    lucide.createIcons();

    const mw = ctxMenu.offsetWidth;
    const mh = ctxMenu.offsetHeight;
    let x = e.clientX + 2;
    let y = e.clientY + 2;
    if (x + mw > window.innerWidth  - 8) x = e.clientX - mw - 2;
    if (y + mh > window.innerHeight - 8) y = e.clientY - mh - 2;
    ctxMenu.style.left = x + 'px';
    ctxMenu.style.top  = y + 'px';
  }

  ctxMenu.addEventListener('click', e => {
    e.stopPropagation();
    const item = e.target.closest('[data-action]');
    if (!item || !_ctxVideo) return;
    const action = item.dataset.action;
    const video  = _ctxVideo;
    hideCtxMenu();
    handleCtxAction(action, video);
  });

  async function handleCtxAction(action, video) {
    const vid = video.video_id;
    switch (action) {
      case 'new-tab':
        window.open(`/watch/${vid}`, '_blank');
        break;

      case 'watch': {
        const cardEl = document.querySelector(`.card[data-video-id="${CSS.escape(vid)}"]`);
        if (cardEl) cardEl.classList.add('watched');
        video.is_watched = true;
        await apiFetch(`/api/v1/videos/${encodeURIComponent(vid)}/watched`, { method: 'POST' });
        break;
      }

      case 'unwatch': {
        const cardEl = document.querySelector(`.card[data-video-id="${CSS.escape(vid)}"]`);
        if (cardEl) cardEl.classList.remove('watched');
        video.is_watched = false;
        await apiFetch(`/api/v1/videos/${encodeURIComponent(vid)}/unwatched`, { method: 'POST' });
        break;
      }

      case 'download':
        await apiFetch(`/api/v1/videos/${encodeURIComponent(vid)}/download`, { method: 'POST' });
        showToast('Download started');
        break;

      case 'delete-file': {
        if (!confirm('Delete the local file? The video stays in the library as a stream.')) break;
        const res = await apiFetch(`/api/v1/videos/${encodeURIComponent(vid)}/file`, { method: 'DELETE' });
        if (res && res.ok) {
          video.is_downloaded = false;
          renderVideos();
          showToast('File deleted');
        }
        break;
      }

      case 'youtube':
        window.open(`https://www.youtube.com/watch?v=${vid}`, '_blank', 'noopener');
        break;

      case 'channel':
        setChannelFilter(video.channel_handle);
        break;

      case 'watch-above': {
        const idx = lastRendered.findIndex(v => v.video_id === vid);
        const ids = lastRendered.slice(0, Math.max(idx, 0)).filter(v => !v.is_watched).map(v => v.video_id);
        if (ids.length === 0) { showToast('Nothing above to mark'); break; }
        if (!confirm(`Mark the ${ids.length} unwatched video${ids.length > 1 ? 's' : ''} above this one as watched?`)) break;
        const res = await apiFetch('/api/v1/videos/watched-bulk', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ video_ids: ids, watched: true }),
        });
        if (res && res.ok) {
          const set = new Set(ids);
          allVideos.forEach(v => { if (set.has(v.video_id)) v.is_watched = true; });
          renderVideos();
          showToast(`Marked ${ids.length} as watched`);
        } else showToast('Failed to update');
        break;
      }

      case 'pin':
      case 'unpin': {
        const pinned = action === 'pin';
        const res = await apiFetch(`/api/v1/videos/${encodeURIComponent(vid)}/pin`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pinned }),
        });
        if (res && res.ok) {
          video.is_pinned = pinned;
          renderVideos();
          showToast(pinned ? 'Pinned to top' : 'Unpinned');
        }
        break;
      }

      case 'details':     openDetails(video, 'sec-info');     break;
      case 'quality':     openDetails(video, 'sec-quality');  break;
      case 'redownload':  openDetails(video, 'sec-download'); break;

      case 'reveal': {
        const res = await apiFetch(`/api/v1/videos/${encodeURIComponent(vid)}/reveal`, { method: 'POST' });
        if (res && !res.ok) showToast((await res.json().catch(() => ({}))).message || 'Could not open the folder');
        break;
      }

      case 'refresh-meta': {
        showToast('Refreshing…');
        const res = await apiFetch(`/api/v1/videos/${encodeURIComponent(vid)}/refresh-metadata`, { method: 'POST' });
        if (res && res.ok) { await loadVideos(true); showToast('Metadata updated'); }
        else if (res) showToast((await res.json().catch(() => ({}))).message || 'Could not refresh');
        break;
      }

      case 'copy-url':
        navigator.clipboard.writeText(`https://www.youtube.com/watch?v=${vid}`);
        showToast('URL copied');
        break;

      case 'remove': {
        const msg = video.is_downloaded
          ? 'Remove from library and delete the local file?'
          : 'Remove this video from the library?';
        if (!confirm(msg)) break;
        const res = await apiFetch(`/api/v1/videos/${encodeURIComponent(vid)}`, { method: 'DELETE' });
        if (res && res.ok) {
          allVideos = allVideos.filter(v => v.video_id !== vid);
          renderVideos();
        }
        break;
      }
    }
  }

  /* ── Details / quality dialog ──────────────────────────── */
  let _dlgVideo = null;
  let _dlgTimer = null;
  let _dlgSnapshot = '';

  function fmtBytes(n) {
    if (!n) return '—';
    const u = ['B', 'KB', 'MB', 'GB', 'TB'];
    let i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return `${n.toFixed(n >= 100 || i === 0 ? 0 : 1)} ${u[i]}`;
  }

  function fmtDuration(sec) {
    if (!sec) return '';
    sec = Math.round(sec);
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
  }

  function heightLabel(h) { return h === 0 ? 'Best available' : h === 2160 ? '4K (2160p)' : `${h}p`; }

  async function openDetails(video, section) {
    _dlgVideo = video;
    _dlgSnapshot = '';
    document.getElementById('dlg-title').textContent = video.video_title || video.video_id;
    document.getElementById('dlg-body').innerHTML = '<div class="dlg-sec"><div class="dlg-note">Loading…</div></div>';
    document.getElementById('dlg-overlay').style.display = 'flex';
    await refreshDetails(section);
    clearInterval(_dlgTimer);
    _dlgTimer = setInterval(() => refreshDetails(), 3000);   // picks up newly built quality versions
  }

  function closeDetails() {
    document.getElementById('dlg-overlay').style.display = 'none';
    clearInterval(_dlgTimer);
    _dlgVideo = null;
  }

  async function refreshDetails(scrollTo) {
    if (!_dlgVideo) return;
    const res = await apiFetch(`/api/v1/videos/${encodeURIComponent(_dlgVideo.video_id)}/details`);
    if (!res || !_dlgVideo) return;
    if (!res.ok) { document.getElementById('dlg-body').innerHTML = '<div class="dlg-sec"><div class="dlg-warn">Could not load details.</div></div>'; return; }
    const d = await res.json();

    const snap = JSON.stringify(d);
    if (snap === _dlgSnapshot) return;                       // unchanged: don't disturb the open dropdown
    const keepHeight = document.getElementById('dlg-height')?.value;
    _dlgSnapshot = snap;

    window.NytDropdown?.closeAll();   // the re-render replaces the select an open menu belongs to
    document.getElementById('dlg-body').innerHTML = renderDetails(d);
    const sel = document.getElementById('dlg-height');
    if (sel && keepHeight !== undefined) sel.value = keepHeight;
    lucide.createIcons();
    if (scrollTo) document.getElementById(scrollTo)?.scrollIntoView({ block: 'start' });
  }

  function renderDetails(d) {
    const pr = d.probe || {};
    const res = pr.width && pr.height ? `${pr.width}×${pr.height}` : '';
    const tech = [res, pr.codec, fmtDuration(pr.duration), pr.bitrate ? `${Math.round(pr.bitrate / 1000)} kb/s` : '']
      .filter(Boolean).join(' · ');
    const when = iso => iso ? new Date(iso).toLocaleString() : '—';
    const row = (k, v, cls = '') => `<div class="dlg-row"><div class="k">${k}</div><div class="v ${cls}">${v}</div></div>`;

    const info = `
      <div class="dlg-sec" id="sec-info">
        ${d.file_missing ? '<div class="dlg-warn">The file is missing from disk. Re-download it below.</div>' : ''}
        ${row('Channel', esc(d.channel_name || d.channel_handle))}
        ${row('Published', esc(d.publish_date ? new Date(d.publish_date).toLocaleDateString() : '—'))}
        ${row('Added', esc(when(d.added_at)))}
        ${row('Status', d.is_downloaded ? 'Downloaded' : 'Stream only (plays from YouTube)')}
        ${d.is_downloaded ? row('Size', esc(fmtBytes(d.size))) : ''}
        ${tech ? row('Video', esc(tech)) : ''}
        ${d.path ? row('File', esc(d.path), 'mono') : ''}
      </div>`;

    let quality = '';
    if (d.is_downloaded && !d.file_missing) {
      const variants = d.variants.map(v => `
        <div class="dlg-variant">
          <span class="name">${esc(v.label)}</span><span class="size">${esc(fmtBytes(v.size))}</span>
          <button class="dlg-btn danger" onclick="removeVariant(${v.height})">Remove</button>
        </div>`).join('');
      const generating = d.generating.map(h => `
        <div class="dlg-variant"><span class="name">${h}p</span><span class="size">Creating…</span></div>`).join('');
      const chips = d.available_heights.map(h =>
        `<button class="dlg-btn" onclick="generateVariant(${h})">+ ${h}p</button>`).join('');
      quality = `
        <div class="dlg-sec" id="sec-quality">
          <h3>Quality versions</h3>
          <div class="dlg-variant"><span class="name">Original${pr.height ? ` (${pr.height}p)` : ''}</span><span class="size">${esc(fmtBytes(d.size))}</span></div>
          ${variants}${generating}
          ${chips ? `<div class="dlg-chips">${chips}</div>` : ''}
          <div class="dlg-note">${chips || d.variants.length || d.generating.length
            ? 'Lower-quality copies are built here from the original, so you can stream at a smaller size when bandwidth is tight. They show up in the player\'s quality menu.'
            : 'The original is already at the smallest quality offered.'}</div>
        </div>`;
    }

    const options = [0, 2160, 1440, 1080, 720, 480, 360]
      .map(h => `<option value="${h}" ${h === d.channel_max_height ? 'selected' : ''}>${heightLabel(h)}</option>`).join('');
    const busy = d.downloading;
    const download = `
      <div class="dlg-sec" id="sec-download">
        <h3>${d.is_downloaded ? 'Re-download' : 'Download'} at quality</h3>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
          <select class="dlg-select" id="dlg-height" ${busy ? 'disabled' : ''}>${options}</select>
          <button class="dlg-btn primary" onclick="startDownload()" ${busy ? 'disabled' : ''}>
            ${busy ? 'Download in progress…' : d.is_downloaded ? 'Re-download' : 'Download'}
          </button>
        </div>
        <div class="dlg-note">${d.is_downloaded
          ? 'Replaces the current file and removes its quality versions. The channel default is preselected.'
          : 'The channel default is preselected.'}</div>
      </div>`;

    return info + quality + download;
  }

  async function dlgCall(url, options, okMsg) {
    const res = await apiFetch(url, options);
    if (!res) return false;
    const body = await res.json().catch(() => ({}));
    if (!res.ok) { showToast(body.message || 'Something went wrong'); return false; }
    if (okMsg) showToast(okMsg);
    return true;
  }

  async function generateVariant(height) {
    if (!_dlgVideo) return;
    const ok = await dlgCall(`/api/v1/videos/${encodeURIComponent(_dlgVideo.video_id)}/variants`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ height }),
    }, `Creating ${height}p — progress shows bottom-right`);
    if (ok) setTimeout(() => refreshDetails(), 600);
  }

  async function removeVariant(height) {
    if (!_dlgVideo || !confirm(`Remove the ${height}p version?`)) return;
    const ok = await dlgCall(`/api/v1/videos/${encodeURIComponent(_dlgVideo.video_id)}/variants/${height}`,
                             { method: 'DELETE' }, `${height}p removed`);
    if (ok) refreshDetails();
  }

  async function startDownload() {
    if (!_dlgVideo) return;
    const height     = parseInt(document.getElementById('dlg-height').value, 10);
    let redownload = false;
    try { redownload = !!JSON.parse(_dlgSnapshot).is_downloaded; } catch {}
    if (redownload && !confirm('Replace the current file and delete its quality versions?')) return;
    const ok = await dlgCall(`/api/v1/videos/${encodeURIComponent(_dlgVideo.video_id)}/download`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ max_height: height, replace: redownload }),
    }, 'Download started — progress shows bottom-right');
    if (ok) closeDetails();
  }

  // Right-click on video cards
  document.addEventListener('contextmenu', e => {
    const cardEl = e.target.closest('.card[data-video-id]');
    if (!cardEl) { hideCtxMenu(); return; }
    const vid   = cardEl.dataset.videoId;
    const video = allVideos.find(v => v.video_id === vid);
    if (video) showCtxMenu(e, video);
  });

  // Dismiss on outside click or Escape
  document.addEventListener('click', e => {
    if (!ctxMenu.contains(e.target)) hideCtxMenu();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { hideCtxMenu(); closeDetails(); }
  });
</script>

</body>
</html>
